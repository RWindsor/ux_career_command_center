name: Discovery filtering checks
on:
  push:
    branches: [fix/discovery-eligibility-rev2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: discovery
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: discovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://discovery:disposable-test-only@127.0.0.1:5432/discovery_test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build_placeholder
          AUTH_SECRET: build-placeholder-not-for-runtime
